<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch Console</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1b1b19; --muted:#62625c; --line:#dcdcd5; --panel:#fff; --accent:#1f5fbf;
          --ok:#1e7a3c; --bad:#b42318; --warn:#9a6700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --fg:#ebebe8; --muted:#a2a29b; --line:#33332f; --panel:#1e1e1c; --accent:#7aa7ff;
            --ok:#6fcf8f; --bad:#ff8a80; --warn:#e3b341; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); }
  main { max-width:72rem; margin:0 auto; padding:1.5rem 1rem 3rem; display:grid; gap:1.25rem; }
  h1 { margin:0; font-size:1.5rem; } h2 { margin:0 0 .75rem; font-size:1.05rem; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(10rem, 1fr)); gap:.75rem; }
  label { display:grid; gap:.25rem; font-size:.85rem; color:var(--muted); }
  input, select, button { font:inherit; padding:.45rem .6rem; border:1px solid var(--line); border-radius:6px;
                          background:var(--bg); color:var(--fg); }
  button { cursor:pointer; border-color:var(--accent); color:var(--accent); background:transparent; }
  button.primary { background:var(--accent); color:var(--panel); }
  .row { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-top:.75rem; }
  .result { font-family:ui-monospace, Menlo, monospace; font-size:.9rem; }
  .APPROVED, .up { color:var(--ok); } .DECLINED, .down { color:var(--bad); }
  .REVERSED, .REVERSAL_PENDING, .timeout { color:var(--warn); }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .hosts { display:grid; grid-template-columns:repeat(auto-fit, minmax(13rem, 1fr)); gap:.75rem; }
  .host { display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
  .hint { color:var(--muted); font-size:.8rem; margin:.5rem 0 0; }
</style>
</head>
<body>
<main>
  <header class="row" style="justify-content:space-between;margin:0">
    <h1>Switch Console</h1>
    <a href="/docs" style="color:var(--accent)">API docs</a>
  </header>

  <section aria-labelledby="send-title">
    <h2 id="send-title">Send transaction</h2>
    <form id="txn-form" class="grid">
      <label>Type
        <select name="type" data-testid="type"><option>purchase</option><option>refund</option></select>
      </label>
      <label>PAN <input name="pan" data-testid="pan" value="4111111111111111" inputmode="numeric" required></label>
      <label>Expiry (YYMM) <input name="expiry" data-testid="expiry" value="2812" required></label>
      <label>Amount (minor units) <input name="amount" data-testid="amount" type="number" value="10000" min="1" required></label>
      <label>Terminal ID <input name="terminal_id" data-testid="terminal-id" value="TERM0001" required></label>
      <label>STAN <input name="stan" data-testid="stan" required></label>
    </form>
    <div class="row">
      <button class="primary" type="submit" form="txn-form" data-testid="send">Send</button>
      <span class="result" data-testid="result" aria-live="polite"></span>
    </div>
    <p class="hint">Amounts ending in 05, 51, 61 or 91 are declined with that code. Set a host down or to timeout to see failover.</p>
  </section>

  <section aria-labelledby="hosts-title">
    <h2 id="hosts-title">Hosts</h2>
    <div class="hosts" id="hosts"></div>
  </section>

  <section aria-labelledby="txn-title">
    <div class="row" style="justify-content:space-between;margin:0 0 .75rem">
      <h2 id="txn-title" style="margin:0">Transactions</h2>
      <div class="row" style="margin:0">
        <button type="button" data-testid="retry-reversals" id="retry">Retry reversals</button>
        <button type="button" data-testid="close-batch" id="close-batch">Close batch</button>
      </div>
    </div>
    <p class="result" data-testid="batch-result" aria-live="polite"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>Type</th><th>Card</th><th class="num">Amount</th><th>RRN</th><th>Host</th>
          <th>Code</th><th>Status</th><th></th></tr></thead>
        <tbody id="txns" data-testid="transactions"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const api = async (path, opts = {}) => {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
  return body;
};
const el = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text ?? ""; if (cls) e.className = cls; return e; };
const nextStan = () => String(Math.floor(Math.random() * 1e6)).padStart(6, "0");
$("[name=stan]").value = nextStan();

async function loadHosts() {
  const box = $("#hosts"); box.replaceChildren();
  for (const h of await api("/v1/hosts")) {
    const row = el("div", "", "host"); row.dataset.testid = `host-${h.id}`;
    row.append(el("span", h.name));
    const select = el("select"); select.dataset.testid = `host-status-${h.id}`; select.className = h.status;
    for (const s of ["up", "down", "timeout"]) { const o = el("option", s); o.selected = s === h.status; select.append(o); }
    select.addEventListener("change", async () => {
      await api(`/v1/hosts/${h.id}`, { method: "PATCH", body: JSON.stringify({ status: select.value }) });
      select.className = select.value;
    });
    row.append(select); box.append(row);
  }
}

async function loadTxns() {
  const body = $("#txns"); body.replaceChildren();
  for (const t of await api("/v1/transactions?limit=25")) {
    const tr = document.createElement("tr"); tr.dataset.testid = `txn-${t.rrn}`;
    tr.append(el("td", new Date(t.created_at).toLocaleTimeString()), el("td", t.type), el("td", t.pan_masked),
      el("td", (t.amount / 100).toFixed(2), "num"), el("td", t.rrn), el("td", t.host_id ?? "none"),
      el("td", `${t.response_code} ${t.response_message}`), el("td", t.status, t.status));
    const cell = el("td");
    if (t.status === "APPROVED" && !t.batch_id) {
      const b = el("button", "Reverse"); b.dataset.testid = "reverse";
      b.addEventListener("click", async () => { await api(`/v1/transactions/${t.id}/reversal`, { method: "POST" }); loadTxns(); });
      cell.append(b);
    }
    tr.append(cell); body.append(tr);
  }
}

$("#txn-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  data.amount = Number(data.amount); data.merchant_id = "MERCHANT0000001";
  try {
    const t = await api("/v1/transactions", { method: "POST", body: JSON.stringify(data) });
    $("[data-testid=result]").textContent = `${t.status} ${t.response_code} ${t.response_message} | RRN ${t.rrn}${t.duplicate ? " | duplicate" : ""}`;
    $("[name=stan]").value = nextStan();
  } catch (err) { $("[data-testid=result]").textContent = `Error: ${err.message}`; }
  loadTxns();
});

$("#close-batch").addEventListener("click", async () => {
  try {
    const b = await api("/v1/settlement/batches", { method: "POST", body: "{}" });
    const totals = Object.entries(b.totals).map(([c, t]) => `${c}: net ${(t.net / 100).toFixed(2)}`).join(", ");
    $("[data-testid=batch-result]").textContent = `Batch closed: ${b.transaction_count} transactions, ${totals}`;
  } catch (err) { $("[data-testid=batch-result]").textContent = `Error: ${err.message}`; }
  loadTxns();
});

$("#retry").addEventListener("click", async () => {
  const r = await api("/v1/reversals/retry", { method: "POST" });
  $("[data-testid=batch-result]").textContent = `Reversals delivered: ${r.delivered.length}, still pending: ${r.still_pending.length}`;
  loadTxns();
});

loadHosts(); loadTxns();
</script>
</body>
</html>
